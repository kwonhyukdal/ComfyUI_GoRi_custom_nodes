name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run node tests
        shell: bash
        run: |
          fail=0
          for node_dir in GoRi-*/; do
            if [ -f "${node_dir}tests/test_node.py" ]; then
              echo "== ${node_dir} =="
              (cd "${node_dir}" && python tests/test_node.py) || fail=1
            fi
          done
          exit $fail
