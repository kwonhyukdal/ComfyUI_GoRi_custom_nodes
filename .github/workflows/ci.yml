name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 왜(Why) 3개 OS인가: 이 노드들은 Windows에서 개발하지만 사용자는
    # macOS·Linux에서도 돌린다. 한 OS에서만 시험하면 "맥에서 깨진다"를
    # CI가 통과시켜 배포한다. 실제로 이 매트릭스가 심볼릭 링크 경로 버그를
    # 잡아냈다(2026-09-28).
    # macos-latest는 arm64라 Apple Silicon 경로(= mediapipe 미설치)까지
    # 검증된다. 그 상태에서도 테스트가 통과해야 한다(그레이드 폴백 확인).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 왜(Why) 이게 없나: 카메라 노드의 tests/test_frontend.js 는 node 로
      # web/progressive_image_inputs.js 를 **실제로 로드해 돌리고**, api_key 화면
      # 가림·워크플로 저장 직렬화 제외·페이로드 가드를 검증한다. node 가 없으면
      # test_node.py 가 "환경 문제, 회귀 아님" 으로 PASS 처리하므로 그 JS 보호가
      # CI 에서 한 번도 실행 검증되지 않았다(2026-09-30 실측).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: |
          pip install numpy pillow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run node tests
        shell: bash
        run: |
          # 왜(Why) 여기서 glob을 하드코딩하지 않나: 배포 폴더명은 Registry 매핑 때문에
          # `ComfyUI-GoRi-camera-director` / `Comfyui-GoRi-Consistency-Keeper` 처럼
          # 서로 다른 대소문자를 섞어 쓰고 있다. 예전 `GoRi-*/` 패턴은 이 두 폴더를
          # 매칭하지 못해 **테스트 0개를 돌고 성공으로 통과**했다.
          # 그래서 최상위 디렉터리 전부를 훑고 테스트 파일이 있는 것만 실행한다.
          fail=0
          ran=0
          for node_dir in */; do
            if [ -f "${node_dir}tests/test_node.py" ]; then
              echo "== ${node_dir} ($(uname -s) py$(python -V 2>&1 | cut -d' ' -f2)) =="
              ran=$((ran + 1))
              (cd "${node_dir}" && python tests/test_node.py) || fail=1
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::노드 테스트를 하나도 찾지 못했다. 폴더 구조를 확인하라."
            fail=1
          fi
          # (왜) 통합 팩 루트 로더는 위 `*/` 루프에 안 잡힌다(루트에 있는 파일).
          # 여기서 회귀하면 "노드 테스트 전부 통과 + NODE_CLASS_MAPPINGS 비어 있음" 으로
          # 조용히 깨진다 — 실제로 2026-09-29 에 그 상태로 게시됐다.
          echo "== pack ($(uname -s) py$(python -V 2>&1 | cut -d' ' -f2)) =="
          (python tests/test_pack.py) || fail=1
          exit $fail
